name: Build ZIVO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ZIVO APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        run: |
          mkdir -p dist
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK भेटिएन"
            exit 1
          fi

          echo "✅ APK भेटियो: $APK"
          cp "$APK" dist/ZIVO.apk

      - name: Upload ZIVO APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIVO-APK
          path: dist/ZIVO.apk
          if-no-files-found: error
