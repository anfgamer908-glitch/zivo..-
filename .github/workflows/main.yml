name: Build ZIVO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ZIVO APK
        run: |
          chmod -R u+rwX .
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        run: |
          mkdir -p apk-output
          APK=$(find . -type f -name "*.apk" -not -path "./apk-output/*" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK भेटिएन"
            find . -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "✅ APK found: $APK"
          cp "$APK" apk-output/ZIVO.apk

      - name: Upload ZIVO APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIVO-APK
          path: apk-output/ZIVO.apk
          if-no-files-found: error
