name: Build ZIVO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/zivo/tournament
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          fi

          if [ -f MainActivity.java ]; then
            cp MainActivity.java app/src/main/java/com/zivo/tournament/MainActivity.java
          fi

          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f styles.xml ]; then
            cp styles.xml app/src/main/res/values/styles.xml
          fi

          if [ -f zivo_icon.png ]; then
            cp zivo_icon.png app/src/main/res/drawable/zivo_icon.png
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZIVO"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zivo.tournament'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zivo.tournament'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
